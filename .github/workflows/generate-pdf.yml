name: Generate CV PDFs

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts (Arabic + emoji)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji fonts-noto-cjk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Generate PDFs
        run: |
          md-to-pdf --launch-options '{ "args": ["--no-sandbox"] }' README.md
          md-to-pdf --launch-options '{ "args": ["--no-sandbox"] }' README.fr.md
          mv README.pdf "Abdelkader_SEBIHI_CV_EN.pdf"
          mv README.fr.pdf "Abdelkader_SEBIHI_CV_FR.pdf"

      - name: Upload PDFs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            Abdelkader_SEBIHI_CV_EN.pdf
            Abdelkader_SEBIHI_CV_FR.pdf

      - name: Publish PDFs to the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          # Create the release with the PDFs, or upload to it if it already exists.
          gh release create "$TAG" --title "$TAG" \
            --notes "Curriculum Vitae (English & French). PDFs generated by CI." \
            "Abdelkader_SEBIHI_CV_EN.pdf" "Abdelkader_SEBIHI_CV_FR.pdf" \
          || gh release upload "$TAG" \
            "Abdelkader_SEBIHI_CV_EN.pdf" "Abdelkader_SEBIHI_CV_FR.pdf" --clobber
